<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D9531E" />
      <stop offset="60%" stop-color="#F2A900" />
      <stop offset="100%" stop-color="#FFF2D6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Caldeirão / Panela de Ferro Caipira -->
  <g transform="translate(10, 8)">
    <!-- Base da Lenha / Brasa -->
    <ellipse cx="32" cy="58" rx="28" ry="6" fill="#2D1513" opacity="0.6" />
    <path d="M12 56 L52 56" stroke="#4A2E2B" stroke-width="4" stroke-linecap="round" />
    <path d="M18 60 L46 60" stroke="#D9531E" stroke-width="3" stroke-linecap="round" />

    <!-- Chamas Vivas do Fogo de Chão -->
    <path d="M32 12 C38 24 46 28 46 38 C46 48 38 52 32 52 C26 52 18 48 18 38 C18 28 26 24 32 12 Z" fill="url(#fireGrad)" filter="url(#glow)" />
    <path d="M32 24 C36 30 40 34 40 40 C40 46 36 48 32 48 C28 48 24 46 24 40 C24 34 28 30 32 24 Z" fill="#FFF2D6" />

    <!-- Caldeirão Rústico de Ferro com Alça -->
    <path d="M14 36 C14 50 20 54 32 54 C44 54 50 50 50 36 Z" fill="#2D1513" stroke="#4A2E2B" stroke-width="2" />
    <ellipse cx="32" cy="36" rx="18" ry="4" fill="#4A2E2B" />
    <!-- Alça do caldeirão -->
    <path d="M14 36 C14 26 50 26 50 36" fill="none" stroke="#D9531E" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Tipografia da Marca -->
  <text x="82" y="38" font-family="'Vollkorn', Georgia, serif" font-size="24" font-weight="700" fill="#4A2E2B" letter-spacing="0.5">
    Fogo de Chão
  </text>
  <text x="83" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#D9531E" letter-spacing="2.5">
    COMITIVA PANTANEIRA
  </text>
  <circle cx="248" cy="34" r="3" fill="#F2A900" />
</svg>
